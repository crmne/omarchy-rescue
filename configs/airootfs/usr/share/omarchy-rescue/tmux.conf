# Omarchy's own tmux setup, plus the rescue additions.
source-file /usr/share/omarchy/config/tmux/tmux.conf

set -g default-shell /bin/bash

# The popup's command runs against the pane underneath it; display-popup does
# not expand formats, so there's no #{pane_id} to pass.
bind -N "Show the last link on screen as a QR code" u display-popup -E -B -w 100% -h 100% omarchy-rescue-qr
bind -N "Omarchy Rescue menu" o new-window -n rescue omarchy-rescue

set -g status-left-length 40
set -g status-left "#[fg=black,bg=red,bold] RESCUE #[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=brightblack]C-Space u: link as QR  C-Space o: menu  #[fg=blue]#{?client_prefix,PREFIX ,}"
