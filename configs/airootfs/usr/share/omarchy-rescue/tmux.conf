# Omarchy's own tmux setup, plus the rescue additions.
source-file /usr/share/omarchy/config/tmux/tmux.conf

set -g default-shell /bin/bash

# The popup's command runs against the pane underneath it; display-popup does
# not expand formats, so there's no #{pane_id} to pass.
bind -N "Open the last link on screen on your phone" u display-popup -E -B -w 100% -h 100% omarchy-rescue-qr
bind -N "Omarchy Rescue menu" o new-window -n rescue omarchy-rescue

# Omarchy's key binding list (C-Space ?) runs a helper the live system
# doesn't have, so it came up empty. List the annotated bindings, Omarchy's and
# the rescue ones above, with tmux itself.
bind -N "Show tmux key bindings" ? display-popup -E -w 80% -h 80% -T " Key bindings (q to close) " "{ tmux list-keys -N -P 'C-Space ' -T prefix; tmux list-keys -N -P '' -T root; } | less"

set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=black,bg=red,bold] RESCUE #[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=brightblack]C-Space u: link to phone  C-Space o: menu  C-Space ?: keys  #[fg=blue]#{?client_prefix,PREFIX ,}"
